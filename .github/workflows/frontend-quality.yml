name: Frontend quality

on:
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-quality.yml'
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-quality.yml'
  workflow_dispatch:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Unit and interaction tests
        env:
          CI: 'true'
        run: npm run test:ci -- --runInBand
      - name: Production build and type-check
        env:
          CI: 'true'
        run: npm run build
